<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 02 — Demo ao Vivo | Teste de Sistemas</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1b2b4d; --ink:#e6ebf5; --muted:#93a3c2;
    --accent:#4ade80; --rule:#2b3a5e; --editor-bg:#0b1424;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  .hdr{display:flex; justify-content:space-between; align-items:center; padding:14px 28px; border-bottom:1px solid var(--rule); font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);}
  .hdr b{color:var(--accent);}

  .main{flex:1; display:flex; overflow:hidden;}
  .panel{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  .panel.editor{border-right:1px solid var(--rule);}

  .panel-title{padding:10px 20px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--rule);}

  .code-area{
    flex:1; background:var(--editor-bg); padding:20px 24px; font-family:'JetBrains Mono',monospace;
    font-size:13.5px; line-height:1.7; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  }
  .k{color:#c792ea;} .a{color:#82aaff;} .s{color:#c3e88d;} .t{color:#ffcb6b;} .c{color:#546e8a;} .fn{color:#82aaff;}
  .cursor{display:inline-block; width:8px; background:var(--accent); animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  .preview-area{flex:1; padding:0; overflow-y:auto; display:flex; align-items:stretch; justify-content:center;}
  .terminal{background:#000; color:#c3e88d; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.7; padding:20px 22px; width:100%; white-space:pre-wrap;}
  .terminal .prompt{color:#82aaff;}
  .terminal .ok-line{color:#4ade80;}
  .terminal .err-line{color:#f97373;}
  .obj-empty{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px; text-align:center; padding-top:40px; width:100%;}

  .narration{padding:14px 28px; border-top:1px solid var(--rule); font-size:14px; color:var(--muted); min-height:20px;}
  .narration b{color:var(--ink);}

  .controls{display:flex; align-items:center; gap:14px; padding:14px 28px; border-top:1px solid var(--rule);}
  button.ctrl{background:var(--panel); border:1px solid var(--rule); color:var(--ink); padding:9px 18px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit;}
  button.ctrl:hover{border-color:var(--accent);}
  button.ctrl:disabled{opacity:.4; cursor:not-allowed;}
  .progress-bar{flex:1; height:6px; background:var(--panel); border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .3s;}
  .step-label{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); min-width:70px; text-align:right;}

  .footer-nav{display:flex; justify-content:space-between; padding:12px 28px; border-top:1px solid var(--rule); font-family:'JetBrains Mono',monospace; font-size:12px;}
  .footer-nav a{color:var(--accent); text-decoration:none;}
</style>
</head>
<body>

<div class="hdr">
  <span>UC <b>Teste de Sistemas</b> · Aula 02 — Demo ao Vivo</span>
  <span>Montando o projeto Maven e o pom.xml</span>
</div>

<div class="main">
  <div class="panel editor">
    <div class="panel-title">Editor — pom.xml</div>
    <div class="code-area" id="codeArea"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Preview — terminal</div>
    <div class="preview-area" id="previewArea">
      <div class="obj-empty">Aguardando o pom.xml ser escrito...<br>Acompanhe a construção ao lado →</div>
    </div>
  </div>
</div>

<div class="narration" id="narration">Clique em <b>Iniciar digitação</b> para começar a construção da classe <b>Produto</b>.</div>

<div class="controls">
  <button class="ctrl" id="btnPrev" onclick="prevStep()">← Anterior</button>
  <button class="ctrl" id="btnPlay" onclick="playStep()">▶ Iniciar digitação</button>
  <button class="ctrl" id="btnNext" onclick="nextStep()">Próxima →</button>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="step-label" id="stepLabel">Etapa 0/5</div>
</div>

<div class="footer-nav">
  <a href="a02_exposicao.html">← Exposição</a>
  <a href="a02_pratica_guiada.html">Prática Guiada →</a>
</div>

<script>
const steps = [
  {
    narration: "Etapa 1 — Iniciamos o pom.xml com as coordenadas GAV: groupId, artifactId e version identificam nosso projeto de forma única.",
    code: `&lt;<span class="t">project</span> xmlns="http://maven.apache.org/POM/4.0.0"&gt;\n    &lt;<span class="a">modelVersion</span>&gt;4.0.0&lt;/<span class="a">modelVersion</span>&gt;\n\n    &lt;<span class="a">groupId</span>&gt;br.edu.testesistemas&lt;/<span class="a">groupId</span>&gt;\n    &lt;<span class="a">artifactId</span>&gt;teste-sistemas-turma&lt;/<span class="a">artifactId</span>&gt;\n    &lt;<span class="a">version</span>&gt;1.0-SNAPSHOT&lt;/<span class="a">version</span>&gt;`,
    preview: null
  },
  {
    narration: "Etapa 2 — Configuramos as properties: versão do Java e o encoding UTF-8 dos arquivos.",
    code: `    &lt;<span class="a">properties</span>&gt;\n        &lt;<span class="a">maven.compiler.source</span>&gt;17&lt;/<span class="a">maven.compiler.source</span>&gt;\n        &lt;<span class="a">maven.compiler.target</span>&gt;17&lt;/<span class="a">maven.compiler.target</span>&gt;\n        &lt;<span class="a">project.build.sourceEncoding</span>&gt;UTF-8&lt;/<span class="a">project.build.sourceEncoding</span>&gt;\n    &lt;/<span class="a">properties</span>&gt;`,
    preview: null
  },
  {
    narration: "Etapa 3 — Declaramos a dependência do JUnit 5, com scope test.",
    code: `    &lt;<span class="a">dependencies</span>&gt;\n        &lt;<span class="t">dependency</span>&gt;\n            &lt;<span class="a">groupId</span>&gt;org.junit.jupiter&lt;/<span class="a">groupId</span>&gt;\n            &lt;<span class="a">artifactId</span>&gt;junit-jupiter&lt;/<span class="a">artifactId</span>&gt;\n            &lt;<span class="a">version</span>&gt;5.10.2&lt;/<span class="a">version</span>&gt;\n            &lt;<span class="a">scope</span>&gt;test&lt;/<span class="a">scope</span>&gt;\n        &lt;/<span class="t">dependency</span>&gt;\n    &lt;/<span class="a">dependencies</span>&gt;`,
    preview: null
  },
  {
    narration: "Etapa 4 — Adicionamos o maven-surefire-plugin, responsável por executar os testes.",
    code: `    &lt;<span class="a">build</span>&gt;\n        &lt;<span class="a">plugins</span>&gt;\n            &lt;<span class="t">plugin</span>&gt;\n                &lt;<span class="a">artifactId</span>&gt;maven-surefire-plugin&lt;/<span class="a">artifactId</span>&gt;\n                &lt;<span class="a">version</span>&gt;3.2.5&lt;/<span class="a">version</span>&gt;\n            &lt;/<span class="t">plugin</span>&gt;\n        &lt;/<span class="a">plugins</span>&gt;\n    &lt;/<span class="a">build</span>&gt;\n&lt;/<span class="t">project</span>&gt;`,
    preview: null
  },
  {
    narration: "Etapa 5 — Rodamos 'mvn compile' no terminal para confirmar que o projeto está configurado corretamente →",
    code: `<span class="c">// pom.xml completo e salvo.</span>\n<span class="c">// Vamos confirmar que o Maven consegue processá-lo:</span>`,
    preview: "terminal"
  }
];

let current = -1;
let typing = false;

function updateControls(){
  document.getElementById('btnPrev').disabled = current <= 0;
  document.getElementById('btnPlay').disabled = typing;
  document.getElementById('btnNext').disabled = current >= steps.length - 1 || typing;
  document.getElementById('stepLabel').textContent = `Etapa ${Math.max(current+1,0)}/${steps.length}`;
  document.getElementById('progressFill').style.width = `${Math.max(current+1,0) / steps.length * 100}%`;
}

function renderPreview(step){
  const area = document.getElementById('previewArea');
  if(!step || !step.preview){
    area.innerHTML = '<div class="obj-empty">Aguardando o pom.xml ser escrito...<br>Acompanhe a construção ao lado →</div>';
    return;
  }
  area.innerHTML = `
    <div class="terminal"><span class="prompt">$</span> mvn compile
[INFO] Scanning for projects...
[INFO] Building teste-sistemas-turma 1.0-SNAPSHOT
[INFO] --------------------------------------
[INFO] Resolving dependency: org.junit.jupiter:junit-jupiter:5.10.2 (scope: test)
[INFO] Compiling source files...
<span class="ok-line">[INFO] BUILD SUCCESS</span>
<span class="prompt">$</span> _</div>`;
}

async function typeCode(html){
  const area = document.getElementById('codeArea');
  area.innerHTML = '<span class="cursor">&nbsp;</span>';
  typing = true;
  updateControls();

  // Parse html into a flat sequence of characters, preserving tags as atomic tokens
  const tokens = html.match(/<[^>]+>|[\s\S]/g) || [];
  let built = '';
  for(const tok of tokens){
    if(tok.startsWith('<')){
      built += tok;
      area.innerHTML = built + '<span class="cursor">&nbsp;</span>';
      continue;
    }
    built += tok;
    area.innerHTML = built + '<span class="cursor">&nbsp;</span>';
    let delay;
    if(tok === '\n') delay = 60;
    else if(tok === ' ') delay = 20;
    else delay = 18 + Math.random() * 25;
    await new Promise(r => setTimeout(r, delay));
    area.scrollTop = area.scrollHeight;
  }
  area.innerHTML = built;
  typing = false;
  updateControls();
}

async function playStep(){
  if(typing) return;
  if(current === -1) current = 0;
  const step = steps[current];
  document.getElementById('narration').innerHTML = step.narration;
  document.getElementById('btnPlay').textContent = '↻ Rever';
  await typeCode(step.code);
  renderPreview(step);
  updateControls();
}

function nextStep(){
  if(typing || current >= steps.length - 1) return;
  current++;
  const step = steps[current];
  document.getElementById('narration').innerHTML = step.narration;
  document.getElementById('codeArea').innerHTML = step.code;
  renderPreview(step);
  document.getElementById('btnPlay').textContent = '↻ Rever';
  updateControls();
}

function prevStep(){
  if(typing || current <= 0) return;
  current--;
  const step = steps[current];
  document.getElementById('narration').innerHTML = step.narration;
  document.getElementById('codeArea').innerHTML = step.code;
  renderPreview(step);
  updateControls();
}

updateControls();
</script>

</body>
</html>
