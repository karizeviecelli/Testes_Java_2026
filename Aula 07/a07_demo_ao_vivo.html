<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula 07 — Demonstração ao vivo</title><style>
:root{--bg:#08111f;--panel:#12233e;--ink:#edf4ff;--muted:#a9bad5;--accent:#4ade80;--blue:#60a5fa;--rule:#294261;--code:#07101d}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}code,.editor,.terminal{font-family:"JetBrains Mono",Consolas,monospace}.hdr{display:flex;justify-content:space-between;gap:12px;padding:11px 20px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted)}.hdr b,.track a.active{color:var(--accent)}.track{display:flex;gap:7px}.track a{color:var(--muted);text-decoration:none}.main{display:grid;grid-template-columns:1.15fr .85fr;flex:1;min-height:0}.pane{display:flex;flex-direction:column;min-width:0}.pane:first-child{border-right:1px solid var(--rule)}.pane-title{padding:9px 16px;border-bottom:1px solid var(--rule);font:700 11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase}.editor{background:var(--code);padding:18px;overflow:auto;white-space:pre-wrap;font-size:12.2px;line-height:1.6;flex:1}.explain{padding:22px;overflow:auto;flex:1}.explain h2{font-size:28px;margin:0 0 9px}.explain p{color:var(--muted);line-height:1.6}.evidence{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-top:15px}.evidence b{color:var(--accent)}.terminal{background:#030711;border:1px solid var(--rule);border-radius:9px;padding:13px;margin-top:14px;color:#c3e88d;font-size:12px;white-space:pre-wrap}.k{color:#c792ea}.t{color:#ffcb6b}.s{color:#c3e88d}.c{color:#6f86a8;font-style:italic}.a{color:#89ddff}.n{color:#f78c6c}.narration{padding:11px 20px;border-top:1px solid var(--rule);color:var(--muted);font-size:13px}.controls{display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--rule)}button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.35}.bar{height:5px;background:var(--panel);flex:1;border-radius:4px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));transition:.25s}.count{font:700 11px "JetBrains Mono",monospace;color:var(--muted)}.footer{display:flex;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--rule);font-size:12px}.footer a{color:var(--accent);text-decoration:none}@media(max-width:780px){.track{display:none}.main{grid-template-columns:1fr}.pane:first-child{border-right:0}.explain{display:none}.editor{font-size:10.9px}.hdr span:last-child{display:none}}
</style></head><body><header class="hdr"><span>UC <b>Teste de Sistemas</b> · Aula 07 — Demonstração</span><nav class="track"><a href="a07_exposicao.html">Exposição</a><a class="active" href="a07_demo_ao_vivo.html">Demo</a><a href="a07_pratica_guiada.html">Prática</a><a href="a07_desafio.html">Desafio</a><a href="a07_feedback.html">Feedback</a></nav><span>PedidoIntegracaoTest.java</span></header><main class="main"><section class="pane"><div class="pane-title">Editor — código completo da etapa</div><div class="editor" id="code"></div></section><section class="pane"><div class="pane-title">Leitura da evidência</div><div class="explain"><h2 id="title"></h2><p id="text"></p><div class="evidence"><b>O que observar</b><p id="evidence"></p></div><div class="terminal" id="terminal"></div></div></section></main><div class="narration" id="narration"></div><div class="controls"><button id="prev">← Anterior</button><button id="replay">↻ Rever etapa</button><button id="next">Próxima →</button><div class="bar"><div class="fill" id="fill"></div></div><span class="count" id="count"></span></div><footer class="footer"><a href="a07_exposicao.html">← Exposição</a><a href="a07_pratica_guiada.html">Prática guiada →</a></footer><script>
const steps=[{"title": "1. Criar Produto", "text": "Começamos por uma unidade simples com uma regra explícita.", "evidence": "Preço zero ou negativo deve ser rejeitado.", "terminal": "Produto compilado.", "code": "public class Produto {\n    private String nome;\n    private double preco;\n\n    public Produto(String nome, double preco) {\n        if (preco &lt;= 0) {\n            throw new IllegalArgumentException(&quot;Preço deve ser maior que zero&quot;);\n        }\n        this.nome = nome;\n        this.preco = preco;\n    }\n\n    public String getNome() { return nome; }\n    public double getPreco() { return preco; }\n}"}, {"title": "2. Provar a unidade", "text": "Antes de integrar, criamos uma evidência pequena e localizada.", "evidence": "Se este teste falhar, sabemos que o problema está em Produto.", "terminal": "✓ ProdutoTest verde.", "code": "@Test\nvoid deveCriarProdutoComPrecoCorreto() {\n    Produto produto = new Produto(&quot;Teclado&quot;, 200);\n    assertEquals(200, produto.getPreco(), 0.001);\n}"}, {"title": "3. Criar Pedido", "text": "Pedido passa a colaborar com objetos Produto.", "evidence": "calcularTotal depende de getPreco de cada Produto.", "terminal": "Pedido compilado.", "code": "public class Pedido {\n    private List&lt;Produto&gt; produtos = new ArrayList&lt;&gt;();\n\n    public void adicionarProduto(Produto produto) {\n        produtos.add(produto);\n    }\n\n    public double calcularTotal() {\n        double total = 0;\n        for (Produto produto : produtos) {\n            total += produto.getPreco();\n        }\n        return total;\n    }\n}"}, {"title": "4. Integrar Produto e Pedido", "text": "Agora o teste atravessa dois componentes reais.", "evidence": "O total correto depende da colaboração entre os objetos.", "terminal": "✓ Integração Produto + Pedido verde.", "code": "@Test\nvoid deveSomarProdutosDoPedido() {\n    Produto p1 = new Produto(&quot;Teclado&quot;, 200);\n    Produto p2 = new Produto(&quot;Mouse&quot;, 100);\n    Pedido pedido = new Pedido();\n\n    pedido.adicionarProduto(p1);\n    pedido.adicionarProduto(p2);\n\n    assertEquals(300, pedido.calcularTotal(), 0.001);\n}"}, {"title": "5. Criar CalculadoraDesconto", "text": "Adicionamos uma terceira peça, mantendo a regra pequena.", "evidence": "Primeiro ela pode ser testada isoladamente.", "terminal": "CalculadoraDesconto compilada.", "code": "public class CalculadoraDesconto {\n    public double aplicar(double valor, double percentual) {\n        return valor - (valor * percentual / 100);\n    }\n}"}, {"title": "6. Integrar desconto ao Pedido", "text": "Pedido obtém o total e entrega esse valor à calculadora.", "evidence": "O fluxo agora atravessa Produto, Pedido e CalculadoraDesconto.", "terminal": "Fluxo integrado pronto.", "code": "public double calcularTotalComDesconto(double percentual) {\n    double total = calcularTotal();\n    CalculadoraDesconto calculadora = new CalculadoraDesconto();\n    return calculadora.aplicar(total, percentual);\n}"}, {"title": "7. Testar o fluxo", "text": "O cenário comprova que R$ 300 com 10% de desconto resulta em R$ 270.", "evidence": "Observe Arrange, Act e Assert no mesmo cenário.", "terminal": "✓ PedidoIntegracaoTest verde.", "code": "@Test\nvoid deveCalcularPedidoComDesconto() {\n    Produto teclado = new Produto(&quot;Teclado&quot;, 200);\n    Produto mouse = new Produto(&quot;Mouse&quot;, 100);\n    Pedido pedido = new Pedido();\n\n    pedido.adicionarProduto(teclado);\n    pedido.adicionarProduto(mouse);\n\n    double resultado = pedido.calcularTotalComDesconto(10);\n\n    assertEquals(270, resultado, 0.001);\n}"}, {"title": "8. Introduzir uma falha", "text": "Quebramos a soma propositalmente para observar a evidência.", "evidence": "O teste mostra que o fluxo falhou, mas testes menores ajudam a localizar a causa.", "terminal": "✗ Expected: 270.0 | Actual: valor incorreto", "code": "// Troque temporariamente:\ntotal += produto.getPreco();\n\n// por:\ntotal -= produto.getPreco();\n\n// Execute novamente todos os testes.\n// Depois restaure a implementação correta."}];let i=0;
function draw(){let s=steps[i];document.getElementById('title').textContent=s.title;document.getElementById('text').textContent=s.text;document.getElementById('evidence').textContent=s.evidence;document.getElementById('terminal').textContent=s.terminal;document.getElementById('code').innerHTML=s.code;document.getElementById('narration').textContent='Explique a intenção antes de executar: '+s.title;document.getElementById('fill').style.width=`${(i+1)/steps.length*100}%`;document.getElementById('count').textContent=`${i+1} / ${steps.length}`;prev.disabled=i===0;next.disabled=i===steps.length-1}
prev.onclick=()=>{i--;draw()};next.onclick=()=>{i++;draw()};replay.onclick=draw;draw();
</script></body></html>
